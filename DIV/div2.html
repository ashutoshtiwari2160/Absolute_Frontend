<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Some basic css properties</title>
  <style type = "text/css">
    .text{
      width:500px ;
      height:300px;
      background-color:black;
      font-size:50px ;
      color:white;
      font-weight:bold;
      font-style:bold; 
      font-style:oblique ;
      text-transform:uppercase ;     /* -- lowercase , capatalize can also be done */
      word-spacing:100px ;  
      letter-spacing:25px ;
    }
    .anchor{
      text-decoration:none ;
    }
    .para{
     width:1000px ;
     height:400px ;
     background-color:blue ;
     color:white;
     font-size:30px ;
     text-align: justify;
      /* left,right,center can also be used for text-align */
       }
  </style>
</head>
<body>
  <div class="text">
    Welcome to my Galaxy
  </div>
  <a href="" class="anchor">SYS</a>
  <p class="para">Lorem ipsum, dolor sit amet consectetur adipisicing elit. Reiciendis illo, delectus quos laudantium nulla tenetur laboriosam! Voluptas tenetur provident quibusdam. Dolor veniam tempore similique, ipsam molestiae voluptates nihil nostrum totam.</p>
</body>
</html>
