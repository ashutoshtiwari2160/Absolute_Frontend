<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CSS Column Properties count , gap , fill</title>
  <style>
   .main{
    height: 50px ;
    column-count:3 ;
    column-gap:50px ;
    column-fill:auto ;
   }
  </style>
</head>
<body>
    <div class = "main">Lorem, ipsum dolor sit amet consectetur adipisicing elit.
      Magnam sequi illo quo expedita laboriosam eaque tempore ullam inventore 
      . Eveniet reprehenderit ratione minus possimus quae sapiente nostrum deleniti, 
      aperiam consectetur?</div>
</body>
</html>
