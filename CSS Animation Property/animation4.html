<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title></title>
  <style>
    *{
      padding:0 ;
      margin:0;
      padding:0 ;
    }
    .box{
      width:100%;
      height:220px ;
      border:2px solid black ;
      position:relative ;
    }
    .sun{
      width:120px ;
      height:120px ;
      background:rgba(255,164,0,0.7) ;
      border-radius :50%;
      position:absolute ;
      top:50px ;
      left:-15px ;
      animation:sun 5s ease-in-out;
    }
    .cloud1{
         width:200px ;
         height:120px ;
         position:absolute ;
         top:20px ;
         left:-10px ;
         opacity:0.8 ;
         animation:cloud1 5s linear;
    }
    .cloud2{
         width:200px ;
         height:120px ;
         position:absolute ;
         top:30px ;
         left:500px ;
         opacity:0.8 ;
         animation: cloud2 3s ease-in ;
         animation-delay:2.5s ;


    }
    .cloud3{
         width:200px ;
         height:120px ;
         position:absolute ;
         top:20px ;
         right:-10px ;
         opacity:0.8 ;
         animation:cloud3 5s ease-in ;
    }
    @keyframes cloud1 {
      from{
        top:20px ;
         left:-10px ;
      }
      to{
        top:20px ;
         left:110% ;
      }
    }
     @keyframes cloud2 {
      from{
       top:30px ;
         left:500px ;
      }
      to{
        top:30px ;
         left: 110%;
      }
    }
     @keyframes cloud3 {
      from{
        top:50px ;
         right:-10px ;
      }
      to{
        top:30px ;
         right:110% ;
      }
    }
    @keyframes sun{
      from{
        top:50x ;
        left: -15px ;
        background:rgba(255,165,0,0.7) ;
      }
      to{
        top:15px ;
        left: 110% ;
        background:rgba(255,165,0,1)
      }
    }
  </style>
</head>
<body>
  <div class="box">
    <div class="sun"></div>
    <div class="cloud1"><h2>1</h2><img src="cloud-blue-sky.jpg" width="100%" height="100%" ></div>
    <div class="cloud2"><h2>2</h2><img src="cloud-blue-sky.jpg" width="100%" height="100%" ></div>
    <div class="cloud3"><h2>3</h2><img src="cloud-blue-sky.jpg" width="100%" height="100%" ></div>
  </div>
</body>
</html>
