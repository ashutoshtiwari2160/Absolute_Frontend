<!DOCTYPE html>
<html>
<head>
    <title>CSS Margin Example</title>
<style>
  body {
    background-color: lightgray;
    font-family: Arial, sans-serif;
}

h1 {
    text-align: center;
    color: darkblue;
}

/* Box 1 */
.box1 {
    width: 300px;
    height: 100px;

    background-color: tomato;
    border: 3px solid red;

    color: white;
    font-size: 30px;
    text-align: center;

    /* Shorthand - 1 value */
    margin: 50px;
}


/* Box 2 */
.box2 {
    width: 300px;
    height: 100px;

    background-color: green;
    border: 3px solid darkgreen;

    color: white;
    font-size: 30px;
    text-align: center;

    /* Shorthand - 2 values */
    margin: 30px 50px;
}


/* Box 3 */
.box3 {
    width: 300px;
    height: 100px;

    background-color: blue;
    border: 3px solid darkblue;

    color: white;
    font-size: 30px;
    text-align: center;

    /* Shorthand - 4 values */
    margin: 10px 20px 30px 40px;
}

</style>
</head>

<body>

    <h1>CSS Margin Shorthand</h1>

    <div class="box1">
        Box 1
    </div>

    <div class="box2">
        Box 2
    </div>

    <div class="box3">
        Box 3
    </div>

</body>
</html>
