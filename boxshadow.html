<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Box Shadow</title>
  <style>
  .main{
    width:500px ;
    height:500px ;
    border: 2px solid black ;
    margin:auto ;
    background-color:rgb(2,200,0,0.9) ;
    font-size:100px ;
    color:white ;
    /* box-shadow: x-axis y-axis blur range color ; */   
    box-shadow: 10px 10px 20px 5px blue ;
 
  }

</style>
</head>
<body>
  <div class="main">Hello Everyone</div>
</body>
</html>
