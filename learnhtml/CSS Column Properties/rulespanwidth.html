<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CSS Column Properties rule , span , width</title>
  <style>
   .main{
    height: 50px ;
    /* column-count:3 ; */
    column-gap: 50px ;
    column-rule : 2px solid red ;
    /* use either column-count or column-width*/
    column-width : 333px ;
   }
   .h2{
    column-span : all ;
   }
  </style>
</head>
<body>
    <div class = "main">
      <h2 class="h2">Welcome to WSCube Tech</h2>
      Lorem, ipsum dolor sit amet consectetur adipisicing elit.
      Magnam sequi illo quo expedita laboriosam eaque tempore ullam inventore 
      . Eveniet reprehenderit ratione minus possimus quae sapiente nostrum deleniti, 
      aperiam consectetur?
    </div>
</body>
</html>
