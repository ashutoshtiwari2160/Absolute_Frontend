<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Add to cart</title>
  <style type="text/css">
    .box{
      width:400px ;
    height:400px ;
    border:2px gred solid ;
    margin-top:100px ;
    margin:auto ;
    position:relative
    }
    .add{
           width:100% ;
           font-size:30px ;
           background-color:rgba(0,0,0,0.6) ;
           color:white ;
           position:absolute ;
           left:0px ;
           bottom:-40px ;
           opacity:0 ;
           transition:2s ;
    }
    .box:hover .add{
            top:0px ;
            opacity:1 ;
    }
  </style>
</head>
<body>
    <div class="box">
      <img src="car1.jpeg" width ="100%" height="100%" /> 
      <input type ="button" name="" value="Add to Cart" class="add"/>
    </div>
</body>
</html>
