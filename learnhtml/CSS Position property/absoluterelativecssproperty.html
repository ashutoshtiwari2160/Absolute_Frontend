<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CSS Positon Property Absolute and relative</title>
  <style>
.col1{
  width:400px ;
  height:400px ;
  border:2px solid black ;
  float:left ;
  background-color :red ;
  color : white;
  box-shadow: 0px 10px 0px 0px rgb(0,0,0);
 font-size:50px ;
 text-align:center ;
}
.col2{
  width:400px ;
  height:400px ;
  border:2px solid black ;
  float:left ;
  background-color : blue ;
  color:white;
  box-shadow: 0px 10px 0px 0px rgb(0,0,0) ;
font-size:50px ;
text-align:center ;
position:relative;
top:200px ;
left:200px;

}
.col3{
  width:400px ;
  height:400px ;
  border:2px solid black ;
  float:left ;
  background-color :green ;
  color:white;
  box-shadow: 0px 10px 0px 0px rgb(0,0,0) ;
  font-size:50px ;
  text-align:center ;
}
  </style>
</head>
<body>
<div class="col1">First</div>
<div class="col2">Second</div>
<div class="col3">Third</div>
</body>
</html>
