<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title> Div Tag Basics </title>
  <style>
    .main{
      width:500px;
      height:500px;
      background-color:red;
    }
    #parent-row-1{
       width:500px;
       height:250px;
       background-color:yellow;
    }
    #parent-row-2{
      width:500px ;
      height:250px;
      background-color: blue ; 
    }
    .col1{
      width:250px ;
      height:250px ;
      background-color:green ;
      float:left;
    }
     .col2{
      width:250px;
      height:250px;
      background-color:red ;
      float:right;
    }
   
  </style>
</head>
<body>
  <div class="main"> <!--main div-->
      <div id = "parent-row-1"><!--Parent row 1-->
           <div class ="col1">Home</div>
           <div class ="col2">About</div> 
      </div> <hr>
      <div id = "parent-row-2">      
           <div class ="col1">Gallery</div>
           <div class ="col2">Contact</div>
      </div>
  </div>
  <h2>HELLO</h2>
</body>
</html>
