<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Scale Function of Transform CSS Property</title>
  <style>
    .main{
      width:100px ;
      height:100px ;
      border:2px solid black ;
      background-color: chartreuse;
      box-shadow : 10px 10px 10px 1px palevioletred ;
      margin:auto ;
      margin-top: 300px ;
      /*
        scale(1.5)  ;
        scaleX(2)  ;
        scaleY(4)  ;
      */
      transform : scale(6) ;

    }
  </style>
</head>
<body>
  <div class="main">Scale Function of Transform CSS Property</div>
</body>
</html>
