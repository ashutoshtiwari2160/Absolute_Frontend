<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Rotate Function</title>
  <style>
.main{
  height:350px ;
  width: 350px ;
  border : 2px solid black ;
  background-color: rgb(0,0,225);
  color:black ;
  margin : auto ;
  margin-top : 100px ;
  font-size: 40px ;
  /*
  rotate(deg|rad)
  rotateX(deg|rad)
  rotateY(deg|rad)
  rotateZ(deg|rad)
  */
  transform:rotateZ(30deg) ;
} 
  </style>
</head>
<body>
  <div class="main">Rotate Function of translate css property</div>
</body>
</html>
