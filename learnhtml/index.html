<!DOCTYPE html>
<html>
<head>
    <title>HTML Formatting Tags</title>
</head>

<body>

    <h1>HTML Formatting Tags</h1>

    <p>
        This is <b>bold text</b>.
    </p>

    <p>
        This is <i>italic text</i>.
    </p>

    <p>
        This is <strong>strong/important text</strong>.
    </p>

    <p>
        This is <del>deleted text</del>.
    </p>

    <p>
        This is <mark>highlighted text</mark>.
    </p>

    <p>
        Hello<br>
        Welcome to HTML<br>
        Have a nice day!
    </p>

</body>
</html>
