<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Data List Tag</title>
</head>
<body>

  <form>
    Course:
    <input type="text" name="course" autofocus list="course">

    <datalist id="course">
      <option value="HTML">
      <option value="PHP">
      <option value="CSS">
      <option value="Laravel">
      <option value="Python">
    </datalist>

    <input type="submit">
  </form>

</body>
</html>
