<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>skew property of transform</title>
  <style>
    .main{
      height:500px ;
      width:500px ;
      border:50px solid black ;
      margin:auto ;
      margin-top: 20px ;
      /*
      skew( , ) deg,rad ,turn 
      skewX( );
      skewY( );
      */
      transform: skew(20deg) ;
    }
  </style>
</head>
<body>
  <div class="main"></div>
</body>
</html>
